name: Secrets Scan

# gitleaks over the working tree with the rules and allowlist in .gitleaks.toml. The binary
# is a pinned release, checked against its published SHA-256 before it runs. Findings are
# redacted in the log. Needs no secret, so fork pull requests run it too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1
